version: 2

# 依赖与 action 版本更新。action 目前按主版本 tag 引用，需要靠 Dependabot 跟上大版本。
# 次要/补丁更新合并成一个 PR，大版本单独开，避免一次升级跨越不兼容范围。
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Cargo.toml / Cargo.lock 在 src-tauri 下。
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch