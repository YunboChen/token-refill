name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 发布判定：分支推送只有在 tauri.conf.json 的版本号相对推送前发生变化时才构建；
  # tag 推送与手动触发视为显式发布，直接构建。
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to build
        id: decide
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          tag="v${version}"
          prev_version=""
          should_build=false
          reason=""

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            should_build=true
            reason="tag push: ${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            should_build=true
            reason="manual dispatch"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              prev_version=$(git show "${before}:src-tauri/tauri.conf.json" 2>/dev/null \
                | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)
            fi
            if [ -z "$prev_version" ]; then
              should_build=true
              reason="no previous version to compare"
            elif [ "$prev_version" != "$version" ]; then
              should_build=true
              reason="version changed: ${prev_version} -> ${version}"
            else
              reason="version unchanged: ${version}"
            fi
          else
            reason="unsupported event: ${GITHUB_EVENT_NAME}"
          fi

          {
            echo "should_build=${should_build}"
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### 发布判定"
            echo ""
            echo "- 结果：**${should_build}**"
            echo "- 版本：\`${version}\`"
            if [ -n "$prev_version" ]; then
              echo "- 上一版本：\`${prev_version}\`"
            fi
            echo "- 原因：${reason}"
          } >> "${GITHUB_STEP_SUMMARY}"

  check:
    name: check
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # tauri.conf.json 的 version 就是安装包版本：三处版本必须一致；
      # tag 推送时还要与 tag 一致，避免安装包与 release 版本不符。
      # Cargo.toml 版本变动会让 Cargo.lock 过期，而下面的检查用的是 --locked，所以一并在这里挡掉。
      - name: Check versions are in sync
        shell: bash
        run: |
          conf_version=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          pkg_version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          cargo_version=$(awk -F'"' '/^version = /{print $2; exit}' src-tauri/Cargo.toml)
          for entry in "tauri.conf.json:$conf_version" "package.json:$pkg_version" "Cargo.toml:$cargo_version"; do
            if [ "${entry#*:}" != "$conf_version" ]; then
              echo "::error::${entry%%:*} 的版本是 ${entry#*:}，与 tauri.conf.json 的 ${conf_version} 不一致。请统一三处版本（改完 Cargo.toml 后重新生成 Cargo.lock）。"
              exit 1
            fi
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$conf_version" != "$tag_version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 应为 ${tag_version}，但 tauri.conf.json 是 ${conf_version}。"
              exit 1
            fi
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # 前端类型检查与产物构建，同时为 Rust 侧准备 tauri.conf.json 指向的 frontendDist。
      - run: pnpm build

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - run: pnpm test:rust

  # 按架构分开构建，各自只出一个 dmg：
  # universal 会把 arm64/x86_64 两套可执行文件塞进同一个 fat binary，安装包和 CI 编译成本都翻倍。
  build-macos:
    name: build macos (${{ matrix.label }})
    needs: [prepare, check]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: arm64
          - target: x86_64-apple-darwin
            label: x64
    env:
      # 未接入 Apple Developer 证书，显式使用 ad-hoc 签名，产物可直接构建但不能通过公证。
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # 规避 tauri#15315：Node 版 CLI 下 libuv 会给继承的 fd 0 打上 close-on-exec，
      # actool 启动时 stdin 已关闭，其助手 ibtoold 崩溃，.icon 也就编不出 Assets.car。
      # cargo-tauri 不经过 libuv，行为正常；用官方预编译二进制，避免在 CI 里现场编译 CLI。
      - name: Install native tauri CLI
        shell: bash
        run: |
          version=$(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")
          case "$(uname -m)" in
            arm64) host=aarch64-apple-darwin ;;
            *) host=x86_64-apple-darwin ;;
          esac
          url="https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${version}/cargo-tauri-${host}.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-tauri.zip" "$url"
          unzip -q "$RUNNER_TEMP/cargo-tauri.zip" -d "$RUNNER_TEMP/cargo-tauri"
          bin=$(find "$RUNNER_TEMP/cargo-tauri" -type f -name cargo-tauri | head -1)
          chmod +x "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"

      # 用 cargo tauri 而不是 pnpm tauri，见上面 tauri#15315 的说明。
      # 只打 dmg：安装包按架构各自独立，也不再附带 .app.tar.gz。
      - name: Build dmg
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          cargo tauri build --target "${{ matrix.target }}" --bundles dmg
          mkdir -p output
          dmg=$(ls src-tauri/target/"${{ matrix.target }}"/release/bundle/dmg/*.dmg 2>/dev/null | head -1) || true
          if [ -z "$dmg" ]; then
            echo "::error::dmg not found"
            exit 1
          fi
          cp "$dmg" "output/Token.Refill_${version}_${{ matrix.label }}.dmg"
          ls -lh output

      # 产物先存成 workflow artifact，由 publish job 统一发到 release，
      # 避免多个 job 并发创建同一个 draft release。
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.label }}
          path: output/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: build windows (x64)
    needs: [prepare, check]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # windows-latest 默认就是 stable-x86_64-pc-windows-msvc；
      # 不要用 GNU 目标（缺 dlltool，且与本项目的 Windows 适配无关）。
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows

      - run: pnpm install --frozen-lockfile

      # Windows 专属分支（exe/cmd 查找、ShellExecuteW、10013 映射）只在 Windows 上编译执行；
      # 这里同时跑方式与 macOS 一致的 --locked 测试。
      - run: pnpm test:rust

      # 一次构建同时拿到两个产物（之前 --no-bundle 和 --bundles nsis 会各编一遍）：
      #   产物一：免安装单文件 exe，依赖系统 WebView2（Win10/11 通常已预装），数据写入 %APPDATA%。
      #   产物二：NSIS 安装器（.exe），不含 MSI。
      # 未配置代码签名证书：两个产物均未签名，首次运行会有 SmartScreen 提示。
      - name: Build portable exe and NSIS installer
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          pnpm tauri build --bundles nsis
          New-Item -ItemType Directory -Force output | Out-Null
          Copy-Item "src-tauri/target/release/token-refill.exe" "output/Token.Refill_${version}_x64.exe"
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          Copy-Item $setup.FullName "output/Token.Refill_${version}_x64-setup.exe"
          Get-ChildItem output | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: output/*.exe
          if-no-files-found: error
          retention-days: 7

  # 所有平台的产物集中到一个 job 发布，避免多个 job 并发创建同一个 draft release。
  publish:
    name: publish draft release
    needs: [prepare, check, build-macos, build-windows]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag 推送时沿用该 tag；手动触发时按 app version 生成 vX.Y.Z。
          tag_name: ${{ needs.prepare.outputs.tag }}
          # 新建 tag 时钉在本次构建的提交上，避免落到仓库默认分支的最新提交。
          target_commitish: ${{ github.sha }}
          name: Token Refill v${{ needs.prepare.outputs.version }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/macos-arm64/*.dmg
            artifacts/macos-x64/*.dmg
            artifacts/windows/*.exe
