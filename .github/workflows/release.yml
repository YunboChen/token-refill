name: release

on:
  push:
    branches:
      - main
    # 提升版本号必然改动这个文件，所以正常发版不受影响；
    # 普通代码提交不再产生空的 Actions 记录。paths 只作用于分支推送，
    # tag 推送仍会触发（GitHub 不对 tag 推送计算路径过滤）。
    paths:
      - "src-tauri/tauri.conf.json"
    tags:
      - "v*"
  workflow_dispatch:

# 默认只读：check 与 build job 只读仓库，写权限只在 publish job 单独授予。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 发布判定：分支推送只有在 tauri.conf.json 的版本号相对推送前发生变化时才构建；
  # tag 推送与 main 上的手动触发视为显式发布，直接构建。
  # 另外拒绝低于已发布版本的版本号：releases/latest 按发布时间选取，
  # 重发旧版本会让用户被"更新"到旧版。
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to build
        id: decide
        shell: bash
        run: |
          # 手动触发只允许在 main 上执行：workflow_dispatch 可以选任意分支，
          # 从 dev / 特性分支直接发布会把未验证的代码推给用户。
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::release 的手动触发只允许在 main 上执行（当前为 ${GITHUB_REF}）。测试构建请使用 build-test workflow。"
            exit 1
          fi

          version=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          # 版本号会进入安装包名、updater 清单与 shell 命令，先按 semver 约束格式。
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tauri.conf.json 的版本 ${version} 不是合法的 semver（期望 X.Y.Z）。"
            exit 1
          fi
          tag="v${version}"
          # 比较两个版本号的数字主干：$1 比 $2 新时返回 0。预发布后缀不参与比较。
          version_gt() {
            local a_major a_minor a_patch b_major b_minor b_patch
            IFS=. read -r a_major a_minor a_patch <<< "${1%%[-+]*}"
            IFS=. read -r b_major b_minor b_patch <<< "${2%%[-+]*}"
            (( a_major > b_major \
              || (a_major == b_major && a_minor > b_minor) \
              || (a_major == b_major && a_minor == b_minor && a_patch > b_patch) ))
          }
          prev_version=""
          should_build=false
          reason=""

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            should_build=true
            reason="tag push: ${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            should_build=true
            reason="manual dispatch"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              prev_version=$(git show "${before}:src-tauri/tauri.conf.json" 2>/dev/null \
                | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)
            fi
            if [ -z "$prev_version" ]; then
              should_build=true
              reason="no previous version to compare"
            elif [ "$prev_version" != "$version" ]; then
              should_build=true
              reason="version changed: ${prev_version} -> ${version}"
            else
              reason="version unchanged: ${version}"
            fi
          else
            reason="unsupported event: ${GITHUB_EVENT_NAME}"
          fi

          # 版本单调性：低于已发布版本的版本号一律拒绝。底线取「推送前的版本」与
          # 「仓库里最新的 v* tag」中较大的一个，覆盖 tag / 手动触发没有 before 的情况。
          # 发布旧版本会让 releases/latest 回退，用户被更新到旧版。
          latest_tag_version=$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | sed 's/^v//' | grep -Fvx "$version" | head -1 || true)
          if [ -z "$prev_version" ]; then
            prev_version="$latest_tag_version"
          elif [ -n "$latest_tag_version" ] && version_gt "$latest_tag_version" "$prev_version"; then
            prev_version="$latest_tag_version"
          fi
          if [ -n "$prev_version" ] && version_gt "$prev_version" "$version"; then
            echo "::error::版本 ${version} 低于已发布的 ${prev_version}。发布旧版本会让 releases/latest 回退，用户被更新到旧版。"
            exit 1
          fi

          {
            echo "should_build=${should_build}"
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### 发布判定"
            echo ""
            echo "- 结果：**${should_build}**"
            echo "- 版本：\`${version}\`"
            if [ -n "$prev_version" ]; then
              echo "- 上一版本：\`${prev_version}\`"
            fi
            echo "- 原因：${reason}"
          } >> "${GITHUB_STEP_SUMMARY}"

  check:
    name: check
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # tauri.conf.json 的 version 就是安装包版本：三处版本必须一致；
      # tag 推送时还要与 tag 一致，避免安装包与 release 版本不符。
      # Cargo.toml 版本变动会让 Cargo.lock 过期，而下面的检查用的是 --locked，所以一并在这里挡掉。
      - name: Check versions are in sync
        shell: bash
        run: |
          conf_version=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          pkg_version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          cargo_version=$(awk -F'"' '/^version = /{print $2; exit}' src-tauri/Cargo.toml)
          for entry in "tauri.conf.json:$conf_version" "package.json:$pkg_version" "Cargo.toml:$cargo_version"; do
            if [ "${entry#*:}" != "$conf_version" ]; then
              echo "::error::${entry%%:*} 的版本是 ${entry#*:}，与 tauri.conf.json 的 ${conf_version} 不一致。请统一三处版本（改完 Cargo.toml 后重新生成 Cargo.lock）。"
              exit 1
            fi
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$conf_version" != "$tag_version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 应为 ${tag_version}，但 tauri.conf.json 是 ${conf_version}。"
              exit 1
            fi
          fi

      # 公钥为空时 updater 无法校验更新包，打包阶段也会失败；在快速检查阶段先给出明确提示。
      - name: Check updater public key is configured
        shell: bash
        run: |
          pubkey=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).plugins.updater.pubkey || ''")
          if [ -z "$pubkey" ]; then
            echo "::error::plugins.updater.pubkey 为空。请按 README「更新签名密钥」生成密钥并填入公钥。"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # 前端类型检查与产物构建，同时为 Rust 侧准备 tauri.conf.json 指向的 frontendDist。
      - run: pnpm build

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - run: pnpm test:rust

  # 按架构分开构建，各自只出一个 dmg：
  # universal 会把 arm64/x86_64 两套可执行文件塞进同一个 fat binary，安装包和 CI 编译成本都翻倍。
  build-macos:
    name: build macos (${{ matrix.label }})
    needs: [prepare, check]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: arm64
          - target: x86_64-apple-darwin
            label: x64
    env:
      # 未接入 Apple Developer 证书，显式使用 ad-hoc 签名，产物可直接构建但不能通过公证。
      APPLE_SIGNING_IDENTITY: "-"
      # 应用内更新包的 minisign 私钥；与 Apple 代码签名无关。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # 规避 tauri#15315：Node 版 CLI 下 libuv 会给继承的 fd 0 打上 close-on-exec，
      # actool 启动时 stdin 已关闭，其助手 ibtoold 崩溃，.icon 也就编不出 Assets.car。
      # cargo-tauri 不经过 libuv，行为正常；用官方预编译二进制，避免在 CI 里现场编译 CLI。
      - name: Install native tauri CLI
        shell: bash
        run: |
          version=$(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")
          case "$(uname -m)" in
            arm64) host=aarch64-apple-darwin ;;
            *) host=x86_64-apple-darwin ;;
          esac
          url="https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${version}/cargo-tauri-${host}.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-tauri.zip" "$url"
          unzip -q "$RUNNER_TEMP/cargo-tauri.zip" -d "$RUNNER_TEMP/cargo-tauri"
          bin=$(find "$RUNNER_TEMP/cargo-tauri" -type f -name cargo-tauri | head -1)
          chmod +x "$bin"
          dirname "$bin" >> "$GITHUB_PATH"

      # 用 cargo tauri 而不是 pnpm tauri，见上面 tauri#15315 的说明。
      # 同时产出 dmg 与 updater 用的 .app.tar.gz：后者由应用内更新下载并替换 .app。
      # createUpdaterArtifacts 只在这里用 --config 打开，本地构建不需要私钥。
      - name: Build dmg and updater archive
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          label="${{ matrix.label }}"
          target="${{ matrix.target }}"
          bundle_dir="src-tauri/target/${target}/release/bundle"
          cargo tauri build --target "$target" --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'
          mkdir -p output
          dmg=$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name '*.dmg' 2>/dev/null | head -1) || true
          if [ -z "$dmg" ]; then
            echo "::error::dmg not found"
            exit 1
          fi
          cp "$dmg" "output/Token.Refill_${version}_macos-${label}.dmg"

          archive=$(find "$bundle_dir/macos" -maxdepth 1 -type f -name '*.app.tar.gz' 2>/dev/null | head -1) || true
          if [ -z "$archive" ] || [ ! -f "${archive}.sig" ]; then
            echo "::error::updater archive or signature not found"
            exit 1
          fi
          cp "$archive" "output/Token.Refill_${version}_macos-${label}.app.tar.gz"
          cp "${archive}.sig" "output/Token.Refill_${version}_macos-${label}.app.tar.gz.sig"
          ls -lh output

      # 产物先存成 workflow artifact，由 publish job 统一发到 release，
      # 避免多个 job 并发创建同一个 release。
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.label }}
          path: output/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: build windows (x64)
    needs: [prepare, check]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # 应用内更新包的 minisign 私钥；与 Authenticode 代码签名无关。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # windows-latest 默认就是 stable-x86_64-pc-windows-msvc；
      # 不要用 GNU 目标（缺 dlltool，且与本项目的 Windows 适配无关）。
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows

      - run: pnpm install --frozen-lockfile

      # Windows 专属分支（exe/cmd 查找、ShellExecuteW、10013 映射）只在 Windows 上编译执行；
      # 这里同时跑方式与 macOS 一致的 --locked 测试。
      - run: pnpm test:rust

      # 一次构建拿到发布用产物与应用内更新包：
      #   产物一：免安装单文件 exe，依赖系统 WebView2（Win10/11 通常已预装），数据写入 %APPDATA%。
      #   产物二：NSIS 安装器（.exe），不含 MSI；v2 updater 直接用它作为更新包，并由 minisign 产出 .exe.sig。
      # 应用内更新只支持 NSIS 安装版；免安装 exe 仍只跳转发布页。
      # 未配置 Authenticode 证书：exe 未签名，首次运行会有 SmartScreen 提示。
      - name: Build portable exe, NSIS installer and updater signature
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          # PowerShell 传原生参数时会吞掉内联 JSON 的双引号，改用临时配置文件。
          $updaterConfig = Join-Path $env:RUNNER_TEMP "updater.json"
          [System.IO.File]::WriteAllText($updaterConfig, '{"bundle":{"createUpdaterArtifacts":true}}')
          pnpm tauri build --bundles nsis --config $updaterConfig
          New-Item -ItemType Directory -Force output | Out-Null
          Copy-Item "src-tauri/target/release/token-refill.exe" "output/Token.Refill_${version}_windows-x64.exe"

          # v2 更新包就是 NSIS 安装器本身，签名文件与安装器同目录。
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          if (-not (Test-Path "$($setup.FullName).sig")) { throw "Updater signature not found" }
          Copy-Item $setup.FullName "output/Token.Refill_${version}_windows-x64-setup.exe"
          Copy-Item "$($setup.FullName).sig" "output/Token.Refill_${version}_windows-x64-setup.exe.sig"
          Get-ChildItem output | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: output/*
          if-no-files-found: error
          retention-days: 7

  # 所有平台的产物集中到一个 job 发布，避免多个 job 并发创建同一个 release。
  publish:
    name: publish release
    needs: [prepare, check, build-macos, build-windows]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 只有创建/更新 Release 需要写权限。
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # 应用内更新从这里读取版本、下载地址与 minisign 签名。
      # 本地构建不产出 updater 包，清单只在发布时生成。
      - name: Generate updater manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}`;
          const signature = (file) => fs.readFileSync(file, 'utf8').trim();
          const platforms = {
            'darwin-aarch64': {
              signature: signature(`artifacts/macos-arm64/Token.Refill_${version}_macos-arm64.app.tar.gz.sig`),
              url: `${base}/Token.Refill_${version}_macos-arm64.app.tar.gz`,
            },
            'darwin-x86_64': {
              signature: signature(`artifacts/macos-x64/Token.Refill_${version}_macos-x64.app.tar.gz.sig`),
              url: `${base}/Token.Refill_${version}_macos-x64.app.tar.gz`,
            },
            'windows-x86_64': {
              signature: signature(`artifacts/windows/Token.Refill_${version}_windows-x64-setup.exe.sig`),
              url: `${base}/Token.Refill_${version}_windows-x64-setup.exe`,
            },
          };
          const manifest = {
            version,
            notes: `Token Refill v${version}`,
            pub_date: new Date().toISOString(),
            platforms,
          };
          fs.writeFileSync('latest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          cat latest.json

      - uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag 推送时沿用该 tag；手动触发时按 app version 生成 vX.Y.Z。
          tag_name: ${{ needs.prepare.outputs.tag }}
          # 新建 tag 时钉在本次构建的提交上，避免落到仓库默认分支的最新提交。
          target_commitish: ${{ github.sha }}
          name: Token Refill v${{ needs.prepare.outputs.version }}
          # 构建成功即发布；没有草稿确认环节，推送前需自行确认版本号与产物。
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            latest.json
            artifacts/macos-arm64/*.dmg
            artifacts/macos-arm64/*.app.tar.gz
            artifacts/macos-arm64/*.sig
            artifacts/macos-x64/*.dmg
            artifacts/macos-x64/*.app.tar.gz
            artifacts/macos-x64/*.sig
            artifacts/windows/*.exe
            artifacts/windows/*.exe.sig
