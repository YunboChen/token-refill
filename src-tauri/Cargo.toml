[package]
name = "token-refill"
version = "0.1.0"
license = "MIT"
description = "A local desktop companion for AI subscription usage"
edition = "2021"

[lib]
name = "token_refill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = "3.5"
getrandom = "0.3"
url = "2"
# Sub2API 的时间字段是 RFC 3339（Go time.Time），统一解析为 Unix 秒。
time = { version = "0.3", features = ["parsing"] }
# 读取 Codex 的 config.toml（只取 provider 的 base_url 与密钥来源）。
toml = "1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-autostart = "2.7.0"

# 打开授权链接直接调 ShellExecuteW，避免经 cmd.exe 解析 URL 里的 & 等字符。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
