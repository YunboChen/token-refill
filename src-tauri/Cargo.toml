[package]
name = "token-refill"
version = "0.1.0"
license = "MIT"
description = "A local desktop companion for AI subscription usage"
edition = "2021"

[lib]
name = "token_refill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
